<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bdb">
<title>3학년 역사 2학기 정리 퀴즈</title>
<style>
  :root{--main:#3b5bdb;--main-d:#2f49b5;--bg:#f4f6fb;--card:#fff;--text:#1f2433;--sub:#6b7185;--line:#dfe3ee;--ok:#2f9e44;--okbg:#e6f6ea;--ng:#e03131;--ngbg:#fdeaea}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.55}
  #app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .pad{padding:16px}
  h1{font-size:24px;margin:8px 0 4px}
  .sub{color:var(--sub);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--main);color:#fff;cursor:pointer}
  .btn:active{background:var(--main-d)}
  .btn.ghost{background:#fff;color:var(--main);border:2px solid var(--main)}
  .btn:disabled{opacity:.4}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .chip{display:flex;align-items:center;gap:10px;padding:12px 4px;font-size:16px;border-bottom:1px solid var(--line)}
  .chip:last-child{border:0}
  .chip input{width:20px;height:20px;accent-color:var(--main)}
  .chip small{color:var(--sub);margin-left:auto}
  .top{position:sticky;top:0;background:var(--bg);padding:12px 16px 8px;z-index:2}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--main);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e7ecff;color:var(--main);margin-bottom:8px}
  .q{font-size:18px;font-weight:600;word-break:keep-all}
  .passage{background:#f7f8fc;border-left:4px solid var(--main);padding:12px;border-radius:8px;font-size:14.5px;margin:0 0 12px;color:#333;word-break:keep-all}
  .blank{display:inline-block;border-bottom:3px solid var(--main);color:var(--main);font-weight:800;padding:0 4px}
  .opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;font-size:16.5px;color:var(--text);cursor:pointer;word-break:keep-all}
  .opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
  .opt.sel{border-color:var(--main);background:#eef1ff}
  .opt.sel b{background:var(--main);color:#fff}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .ox button{border:3px solid var(--line);background:#fff;border-radius:20px;font-size:64px;font-weight:800;height:140px;cursor:pointer;color:#999}
  .ox button.sel.o{border-color:var(--main);color:var(--main);background:#eef1ff}
  .ox button.sel.x{border-color:var(--ng);color:var(--ng);background:var(--ngbg)}
  textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;resize:vertical;margin-top:10px}
  textarea:focus{outline:0;border-color:var(--main)}
  .foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding:18px 16px 16px;margin-top:auto}
  .score{text-align:center;padding:26px 16px}
  .score .big{font-size:64px;font-weight:800;color:var(--main);line-height:1.1}
  .score .big small{font-size:24px;color:var(--sub)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--sub)}
  .stats b{display:block;font-size:20px;color:var(--text)}
  .rv{border-left:6px solid var(--ok)}
  .rv.bad{border-left-color:var(--ng)}
  .rv h4{margin:0 0 6px;font-size:15px;font-weight:600;word-break:keep-all}
  .rv .l{font-size:14px;margin:3px 0}
  .good{color:var(--ok);font-weight:700}.bad-t{color:var(--ng);font-weight:700}
  .ex{background:#f7f8fc;border-radius:10px;padding:8px 10px;font-size:13.5px;color:#444;margin-top:8px;word-break:keep-all}
  .tabs{display:flex;gap:8px;margin:6px 0 4px}
  .tabs button{flex:1;padding:10px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
  .tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
  .peek{margin-top:18px;padding:12px;font-size:15px}
  .ansbox{background:var(--okbg);border:1px solid #b7e2c1;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:16px;word-break:keep-all}
  .ansbox b{color:var(--ok);margin-right:6px}
  .gradelink{display:block;margin:10px auto 0;background:none;border:0;color:var(--sub);font-size:14px;font-weight:600;padding:6px 12px;text-decoration:underline;cursor:pointer}
  .mini{border:1px solid var(--main);background:#fff;color:var(--main);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ======================= 문제 데이터 ======================= */
const B = []; // 5지선다
const OX = [];
const ES = [];

const ox = (label, text, ans, ex, passage) => OX.push({sec:"ox", label, text, ans, ex, passage});

/* ---- Ⅰ. O/X ---- */
ox("Ⅰ-1","태종은 호패법을 실시하고 집현전을 설치하였다.",false,"호패법은 태종이 실시했고, 집현전은 세종이 설치했습니다. 두 사실이 섞인 문장입니다.");
ox("Ⅰ-2","세종 때 종묘제례악이 완성되었다.",true,"세종 때 종묘제례악을 완성했습니다.");
ox("Ⅰ-3","태조는 『경국대전』의 편찬을 시작하였다.",false,"경국대전은 세조 때 편찬을 시작해 성종 때 완성했습니다.");
ox("Ⅰ-4","『경국대전』은 조선의 기본 법전으로 이전, 호전, 예전, 병전, 형전, 공전의 6전 체제로 되어 있다.",true,"이전·호전·예전·병전·형전·공전 6전 체제입니다.");
ox("Ⅰ-5","3사는 사간원, 사헌부, 춘추관을 나타낸다.",false,"3사는 사간원, 사헌부, 홍문관입니다. 춘추관은 3사가 아닙니다.");
ox("Ⅰ-6","3사는 왕권을 강화하는 기관이다.",false,"3사는 왕권을 견제하는 기관입니다.");
ox("Ⅰ-7","세조는 홍문관을 설치하였다.",false,"홍문관은 성종 때 설치했습니다.");
ox("Ⅰ-8","『주자가례』는 유학 교육의 입문서이다.",false,"유학 교육의 입문서는 『소학』입니다. 『주자가례』는 유교 의례서입니다.");
ox("Ⅰ-9","연산군 대에 일어난 사화는 기묘사화와 을사사화이다.",false,"연산군 때는 무오사화와 갑자사화가 일어났습니다.");
ox("Ⅰ-10","서인은 주로 이황과 조식 등의 제자들로 이루어졌다.",false,"이황·조식의 제자들은 동인입니다.");
ox("Ⅰ-11","혼천의는 천체의 운행과 위치를 측정한 천문 관측 기구이다.",true,"혼천의는 천체 운행과 위치를 측정하는 천문 관측 기구입니다.");
ox("Ⅰ-12","궁중 음악을 그림과 함께 설명한 책은 『악학궤범』이다.",true,"성종 때 편찬한 『악학궤범』은 궁중 음악을 그림과 함께 설명한 책입니다.");
ox("Ⅰ-13","조선 국왕의 통치 기록을 모은 책은 『고려사』이다.",false,"조선 국왕의 통치 기록은 『조선왕조실록』입니다.");
ox("Ⅰ-14","임진왜란 때 의병은 향토 지리에 밝은 이점으로 일본군에게 타격을 주었다.",true,"의병은 향토 지리에 밝은 이점을 살려 일본군에게 타격을 주었습니다.");
ox("Ⅰ-15","임진왜란의 주요 전투에는 권율이 이끈 한산도 대첩이 있다.",false,"한산도 대첩은 이순신이 이끌었습니다. (권율은 행주 대첩)");
ox("Ⅰ-16","현종 때 왕실의 상복 입는 기간을 두고 서인과 남인 간에 일어난 논쟁이 예송이다.",true,"현종 때 상복 입는 기간을 둘러싼 논쟁은 예송입니다.");
ox("Ⅰ-17","병자호란 이후 청을 정벌하여 조선의 치욕을 씻고 명의 복수를 하자는 북벌론이 대두하였다.",true,"병자호란 이후 청에 복수하자는 북벌론이 대두했습니다.");
ox("Ⅰ-18","숙종 때 왕권 강화를 위해 의도적으로 집권 붕당을 급격히 교체하는 정국 변화를 환국이라고 한다.",true,"숙종 때 집권 붕당을 급격히 바꾼 정국 변화는 환국입니다.");
ox("Ⅰ-20","영조는 서얼에 대한 차별을 완화하여 능력 있는 서얼을 규장각 검서관으로 등용하기도 하였다.",false,"서얼을 규장각 검서관으로 등용한 것은 정조입니다.");

const P22 = "빌려주고 빌리는 건 양쪽 다 원해야지 억지로 강제하면 불편해져서 온 땅을 통틀어도 고개만 저을 뿐 빌리겠단 사람은 하나도 없네. 봄철에 좀먹은 쌀 한 말 받고서 가을에 온전한 쌀 두 말을 바치고 게다가 좀먹은 쌀값 돈으로 내라 하니 온전한 쌀 판 돈을 바칠 수밖에 이익으로 남는 것은 간사하고 교활한 자 살을 찌워 한 번 벼슬길에 천경 논이 생긴다네. — 정약용, 『다산시선』<br><b>※ 위 지문에서 나타난 당시 사회 모습으로 맞으면 O, 틀리면 X.</b>";
ox("Ⅰ-22 ①","세도 정치 시기이다.",true,"환곡의 폐단은 세도 정치 시기의 삼정의 문란입니다.",P22);
ox("Ⅰ-22 ②","처가살이가 일반적이었다.",false,"조선 후기에는 처가살이가 아니라 시집살이가 확산됐습니다.",P22);
ox("Ⅰ-22 ③","매관매직이 성행했다.",true,"매관매직이 성행했습니다.",P22);
ox("Ⅰ-22 ④","자녀 균분 상속이 이루어졌다.",false,"균분 상속이 아니라 장남 우대 상속으로 바뀌었습니다.",P22);
ox("Ⅰ-22 ⑤","예언 사상과 동학이 유행하였다.",true,"예언 사상과 동학이 유행했습니다.",P22);
ox("Ⅰ-23","삼정의 문란과 자연재해로 인해 사회 불안이 심화되면서 미래의 부처인 미륵이 내려와 백성을 구원한다는 미륵 신앙이 확산되었다.",true,"미륵 신앙이 확산됐습니다.");
ox("Ⅰ-24","홍경래의 난은 서북 지역에 대한 차별, 세도 정권의 수탈을 이유로 평안도에서 봉기하였다.",true,"홍경래의 난은 서북 지역 차별과 세도 정권의 수탈이 배경입니다.");
ox("Ⅰ-25","1862년 진주 농민 봉기를 시작으로 임술 농민 봉기가 전국에서 일어났다.",true,"1862년 진주 농민 봉기가 임술 농민 봉기의 시작입니다.");
ox("Ⅰ-26","기술직 중인이 전개한 신분 상승을 위한 집단 상소 운동은 정부에게 받아들여졌다.",false,"기술직 중인의 집단 상소는 성과를 거두지 못했습니다.");
ox("Ⅰ-27","조선 후기 양반은 붕당 정치의 변질로 인해 상당수가 중앙 정치에서 밀려난 잔반, 향반이 되었다.",true,"붕당 정치의 변질로 양반 상당수가 잔반·향반이 됐습니다.");
ox("Ⅰ-28","영조 때 공노비가 해방되었다.",false,"공노비 해방은 순조 때입니다. 영조는 노비종모법을 시행했습니다.");
ox("Ⅰ-29","조선 후기 농업 중심의 개혁을 추구하던 실학자는 박지원, 박제가가 대표적이다.",false,"박지원·박제가는 상공업 중심 실학자입니다.");
ox("Ⅰ-30","유형원은 신분에 따른 균등한 토지 분배를 주장하였다.",false,"유형원은 균등 분배가 아니라 신분에 따라 차등 분배하는 균전론을 주장했습니다.");
ox("Ⅰ-31","정선의 「인왕제색도」와 「금강전도」는 진경산수화이다.",true,"정선의 진경산수화입니다.");
ox("Ⅰ-32","신윤복이 그린 「주막」은 생활상을 그린 풍속화이다.",false,"「주막」은 김홍도의 작품입니다. 신윤복은 「월하정인」입니다.");
ox("Ⅰ-33","조선 후기에는 서민들의 구체적이고 현실적인 소망을 담은 민화가 유행하였고 「십장생도」, 「모란도」 등의 작품이 대표적이다.",true,"서민의 소망을 담은 민화입니다.");

/* ---- 5지선다: 순서 배열 / 지도 ---- */
const mc = (label, text, opts, ex, passage) => B.push({sec:"mc", label, text, opts, ans:opts[0], ex, passage});

mc("Ⅰ-19","다음 사건들을 시간 순서대로 바르게 나열한 것은?<br>(가) 일본은 명 정벌의 길을 내어달라고 하며 조선을 침략하였다.<br>(나) 3년간 휴전 회담을 진행하였으나 결렬되어 정유재란이 발발하였다.<br>(다) 이순신이 이끄는 수군은 철수하는 일본군을 노량 해전에서 물리쳤다.<br>(라) 조선과 명의 연합군이 평양성을 탈환하였다.<br>(마) 선조는 의주로 피난하였다.",
 ["(가)→(마)→(라)→(나)→(다)","(가)→(라)→(마)→(나)→(다)","(마)→(가)→(라)→(다)→(나)","(가)→(마)→(나)→(라)→(다)","(가)→(마)→(라)→(다)→(나)"],
 "임진왜란 발발 → 선조 의주 피난 → 평양성 탈환 → 휴전 회담 결렬과 정유재란 → 노량 해전");
mc("Ⅰ-21","다음 사건을 시간 순서대로 바르게 나열한 것은?<br>(가) 청이 군신 관계를 요구하며 조선을 압박함<br>(나) 병자호란 때 인조가 남한산성에서 항전함<br>(다) 광해군의 중립 외교<br>(라) 정묘호란으로 조선이 후금과 형제 관계를 맺음<br>(마) 북벌론이 대두함",
 ["(다)→(라)→(가)→(나)→(마)","(다)→(가)→(라)→(나)→(마)","(라)→(다)→(가)→(나)→(마)","(다)→(라)→(나)→(가)→(마)","(다)→(라)→(가)→(마)→(나)"],
 "광해군 중립 외교 → 정묘호란 후 형제 관계 → 청의 군신 관계 요구 → 병자호란 → 북벌론");
mc("Ⅰ-34","다음 사건·지역과 그 위치가 바르게 연결된 것은?<br>(4군, 6진, 홍경래의 난, 진주 농민 봉기(1862))",
 ["4군 – 압록강 일대 / 6진 – 두만강 일대 / 홍경래의 난 – 평안도 / 진주 농민 봉기 – 경상도",
  "4군 – 두만강 일대 / 6진 – 압록강 일대 / 홍경래의 난 – 평안도 / 진주 농민 봉기 – 경상도",
  "4군 – 압록강 일대 / 6진 – 두만강 일대 / 홍경래의 난 – 함경도 / 진주 농민 봉기 – 경상도",

};
const $app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; };
const CIR = "①②③④⑤";
let S = null;      // 현재 시험 상태
let cfg = {ox:true, mc:true, es:true, shuffle:false};

function home(){
  S = null;
  const total = k => SECS[k].list.length;
  $app.innerHTML = `
  <div class="pad">
    <h1>📜 3학년 역사 2학기<br>정리 퀴즈</h1>
    <div class="sub">한 문제씩 풀고 [다음]을 누르세요. 모두 풀면 자동으로 채점합니다.</div>
    <div class="card">
      ${Object.keys(SECS).map(k=>`<label class="chip"><input type="checkbox" data-k="${k}" ${cfg[k]?"checked":""}>${SECS[k].name}<small>${total(k)}문제</small></label>`).join("")}
      <label class="chip"><input type="checkbox" data-k="shuffle" ${cfg.shuffle?"checked":""}>문제 순서 섞기</label>
    </div>
    <button class="btn" id="start">시작하기</button>
  </div>`;
  $app.querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>cfg[i.dataset.k]=i.checked);
  document.getElementById("start").onclick=()=>{
    let qs=[]; ["ox","mc","es"].forEach(k=>{ if(cfg[k]) qs=qs.concat(SECS[k].list); });
    if(!qs.length) return alert("문제 유형을 하나 이상 선택하세요.");
    begin(cfg.shuffle?shuffle(qs):qs);
  };
}

function begin(qs){
  // 각 문제의 보기 순서를 한 번만 섞어 둔다
  S = {qs: qs.map(q=>({...q, shown: q.opts ? shuffle(q.opts) : null})), i:0, ans:[], over:{}, rev:{}};
  show();
}

function show(){
  const q=S.qs[S.i], n=S.qs.length, a=S.ans[S.i];
  const tag = q.sec==="ox"?"O / X":q.sec==="mc"?"5지선다":"서술형";
  let body="";
  if(q.sec==="ox"){
    body=`<div class="ox"><button class="o ${a===true?"sel":""}" data-v="1">O</button><button class="x ${a===false?"sel":""}" data-v="0">X</button></div>`;
  } else if(q.sec==="mc"){
    body=q.shown.map((o,k)=>`<button class="opt ${a===o?"sel":""}" data-v="${k}"><b>${CIR[k]}</b><span>${o}</span></button>`).join("");
  } else {
    body=`<textarea id="essay" placeholder="답안을 직접 써 보세요.">${a||""}</textarea>`;
  }
  const last = S.i===n-1;
  const shown = !!S.rev[S.i];
  const answerBox = shown
    ? `<div class="ansbox"><div><b>정답</b> ${ansText(q)}</div>${q.ex?`<div class="ex">💡 ${q.ex}</div>`:""}</div>`
    : "";
  $app.innerHTML=`
  <div class="top"><div class="meta"><span>${q.label}</span><span>${S.i+1} / ${n}</span></div><div class="bar"><i style="width:${(S.i)/n*100}%"></i></div></div>
  <div class="pad" style="flex:1">
    <span class="tag">${tag}</span>
    ${q.passage?`<div class="passage">${q.passage}</div>`:""}
    <div class="q">${q.text}</div>
    ${body}
    <button class="btn ghost peek" id="peek">${shown?"답 숨기기":"👀 답 보기"}</button>
    ${answerBox}
  </div>
  <div class="foot">
    <div class="row">
      ${S.i>0?`<button class="btn ghost" id="prev" style="flex:.6">이전</button>`:""}
      <button class="btn" id="next">${last?"제출하고 채점":"다음"}</button>
    </div>
    ${last?"":`<button class="gradelink" id="grade">채점하러 가기 ›</button>`}
  </div>`;
  document.getElementById("peek").onclick=()=>{S.rev[S.i]=!S.rev[S.i];show();};
  const g=document.getElementById("grade"); if(g) g.onclick=goGrade;
  if(q.sec==="ox") $app.querySelectorAll(".ox button").forEach(b=>b.onclick=()=>{S.ans[S.i]=b.dataset.v==="1";show();});
  if(q.sec==="mc") $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.i]=q.shown[+b.dataset.v];show();});
  if(q.sec==="es") document.getElementById("essay").oninput=e=>S.ans[S.i]=e.target.value;
  const p=document.getElementById("prev"); if(p) p.onclick=()=>{S.i--;show();window.scrollTo(0,0)};
  document.getElementById("next").onclick=()=>{
    if(last) return goGrade();
    S.i++; show(); window.scrollTo(0,0);
  };
}

function ansText(q){
  return q.sec==="ox" ? (q.ans?"O":"X") : q.sec==="es" ? q.model : q.ans;
}

function goGrade(){
  const un=S.qs.filter((x,k)=>S.ans[k]===undefined||S.ans[k]==="").length;
  if(un && !confirm(`아직 답하지 않은 문제가 ${un}개 있어요. 그래도 채점할까요?\n(안 푼 문제는 오답 처리돼요)`)) return;
  filter="all"; result();
}

function judge(q,a,k){
  if(q.sec==="es"){
    if(k in S.over) return S.over[k];
    const t=(a||"").replace(/\s/g,"");
    return q.kw.filter(w=>t.includes(w.replace(/\s/g,""))).length>=q.need;
  }
  if(q.sec==="ox") return a===q.ans;
  return a===q.ans;
}

let filter="all";
function result(){
  const n=S.qs.length;
  const res=S.qs.map((q,k)=>judge(q,S.ans[k],k));
  const right=res.filter(Boolean).length, score=Math.round(right/n*100);
  const msg = score>=90?"완벽해요! 🎉":score>=70?"잘했어요! 👍":score>=50?"조금만 더 복습해요 💪":"오답 노트부터 차근차근! 📚";
  const by=k=>{const idx=S.qs.map((q,i)=>q.sec===k?i:-1).filter(i=>i>=0); return idx.length?`${idx.filter(i=>res[i]).length}/${idx.length}`:"-"};
  const view = S.qs.map((q,k)=>({q,k,ok:res[k]})).filter(x=>filter==="all"||!x.ok);
  const fmt=(q,a)=> a===undefined||a===""?"(무응답)": q.sec==="ox"?(a?"O":"X"): q.sec==="es"?a.replace(/</g,"&lt;"): a;
  $app.innerHTML=`
  <div class="score">
    <div class="sub">채점 결과</div>
    <div class="big">${score}<small>점</small></div>
    <div style="font-weight:700;margin-top:6px">${msg}</div>
    <div class="sub">${n}문제 중 ${right}문제 정답</div>
    <div class="stats"><div><b>${by("ox")}</b>O/X</div><div><b>${by("mc")}</b>5지선다</div><div><b>${by("es")}</b>서술형</div></div>
  </div>
  <div class="pad" style="padding-top:0">
    <div class="tabs"><button class="${filter==="all"?"on":""}" data-f="all">전체 보기</button><button class="${filter==="bad"?"on":""}" data-f="bad">틀린 문제만 (${n-right})</button></div>
    ${view.map(({q,k,ok})=>`
    <div class="card rv ${ok?"":"bad"}">
      <div class="sub">${q.label} · ${ok?'<span class="good">정답</span>':'<span class="bad-t">오답</span>'}</div>
      ${q.passage?`<div class="passage" style="font-size:13px">${q.passage.split("<br>")[0]}</div>`:""}
      <h4>${q.text}</h4>
      <div class="l">내 답: <b>${fmt(q,S.ans[k])}</b></div>
      <div class="l">정답: <b class="good">${q.sec==="ox"?(q.ans?"O":"X"):q.sec==="es"?q.model:q.ans}</b></div>
      ${q.ex?`<div class="ex">💡 ${q.ex}</div>`:""}
      ${q.sec==="es"?`<div class="ex">키워드 자동채점이라 틀릴 수 있어요. 모범 답안과 비교해 직접 바꿔 보세요.<br><button class="mini" data-o="${k}">${ok?"틀림으로 바꾸기":"맞음으로 바꾸기"}</button></div>`:""}
    </div>`).join("") || `<div class="card sub" style="text-align:center">틀린 문제가 없어요! 👏</div>`}
    <div class="row" style="margin:16px 0 28px">
      ${n-right?`<button class="btn" id="retryWrong">틀린 문제만 다시</button>`:""}
      <button class="btn ghost" id="again">처음으로</button>
    </div>
  </div>`;
  $app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;result();});
  $app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const k=+b.dataset.o;S.over[k]=!res[k];result();});
  const rw=document.getElementById("retryWrong"); if(rw) rw.onclick=()=>{filter="all";begin(S.qs.filter((q,k)=>!res[k]).map(({shown,...q})=>q));window.scrollTo(0,0)};
  document.getElementById("again").onclick=()=>{filter="all";home();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
